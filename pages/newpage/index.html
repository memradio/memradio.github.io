<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/image/favicon.ico" type="image/x-icon">
    <title>🆕 Створити свою мем-сторінку</title>
    <link rel="stylesheet" href="/index.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="/components/Footer.css" />
    <link rel="stylesheet" href="/components/Header.css" />
    <link rel="stylesheet" href="/components/scrollToTopBtn.css" />
    <link rel="stylesheet" href="/pages/submit/index.css" />
</head>

<body>

    <div id="app">
        <div id="mainContent" class="container">
            <form id="newPageForm" class="submit-form">
                <div class="form-group">
                    <input type="text" id="newPageName" placeholder="Ваш нікнейм або назва *" required />
                    <label for="newPageName">Назва сторінки (латиницею, без пробілів)</label>
                </div>
                <label for="emoji">Іконка сторінки (емодзі):</label>
                <div class="emoji-picker-wrapper">
                    <button type="button" id="emojiBtn" class="emoji-picker-btn">📦 Вибери емодзі</button>
                    <emoji-picker id="emojiPicker" style="display: none;"></emoji-picker>
                    <input required type="text" id="emoji" name="emoji" value="📦" style="display: none;" />
                </div>

                <button type="submit">Створити</button>
            </form>
            <div id="status" class="success" style="display: none;"></div>
            <div class="pending-users-link" style="text-align: center; margin-top: 20px;">
                <a href="https://github.com/memradio/memradio.github.io/pulls?q=is%3Apr+is%3Aopen+%D0%9A%D0%BE%D1%80%D0%B8%D1%81%D1%83%D1%82%D0%B2%D0%B0%D1%87"
                    target="_blank" style="font-size: 14px; text-decoration: underline; color: #3f51b5;">
                    🔍 Переглянути користувачів, які очікують підтвердження
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="./newpage.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</body>

</html>
