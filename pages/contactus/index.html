<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <title>Звʼязок з нами — Мєм Рація</title>
  <style>
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/components/Footer.css">
  <link rel="stylesheet" href="/components/Header.css">
  <link rel="stylesheet" href="./contactus.css">
  <link rel="stylesheet" href="/components/scrollToTopBtn.css">
</head>

<body>

  <div id="app">
    <div id="mainContent">

      <div class="contact-links">
        <p>
          ✉ Напиши нам:
          <a href="mailto:proladge@gmail.com">memradio@protonmail.com</a>
        </p>
        <p>
          <a href="https://t.me/v_kovi" target="_blank" class="tg-link">
            <i class="fab fa-telegram-plane"></i> @memradio
          </a>
        </p>
      </div>


      <form id="contact-form">

        <label>
          <input type="checkbox" id="wantReply"> Хочу отримати відповідь
        </label>

        <div id="emailField" style="display: none;">
          <label for="email">Email:</label>
          <input type="email" name="email" id="email" placeholder="name@example.com">
        </div>

        <label for="message">Повідомлення:</label>
        <textarea name="message" id="message" required></textarea>

        <button type="submit">Надіслати</button>
        <div class="success-message" id="success-message" style="display: none;">
          Дякуємо! Ваше повідомлення надіслано.
        </div>
      </form>
    </div>
  </div>


  <script type="module" src="./contactus.js"></script>
</body>

</html>
